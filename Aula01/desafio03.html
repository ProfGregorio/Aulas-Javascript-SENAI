<body>
    <h1>REALIZANDO OPERAÇÃO COM NÚMEROS EM JS <mark>E EXIBINDO DIRETAMENTE NO HTML</mark></h1>
    <hr>
    <h2 id="num1"></h2>
    <h2 id="operacao"></h2>
    <h2 id="num2"></h2>
    --------------------
    <h2 id="resultado"></h2>
    <script>
        window.alert("Seja bem-vindo a ferramenta de operação de números");
        let numero1 = window.prompt("DIGITE O 1º NÚMERO: ");
        let numero2 = window.prompt("DIGITE O 2º NÚMERO: ");
        let operacao = window.prompt("QUAL OPERAÇÃO: (+) SOMA | (-) SUBTRAÇÃO | (*) MULTIPLICAÇÃO | (/) DIVISÃO   ");
        let resultado = 0

        numero1 = parseInt(numero1) // parseFloat
        numero2 = parseInt(numero2) // parseFloat

        if (operacao == "+") {
            resultado = numero1 + numero2

        } else if (operacao == "-") {
            resultado = numero1 - numero2
        }
        else if (operacao == "*") {
            resultado = numero1 * numero2
        }
        else if (operacao == "/") {
            if(numero2 == 0){
                resultado="NÃO É POSSÍVEL DIVISÃO POR ZERO!"
            }else{
                resultado = numero1 / numero2
            }
        }
        else {
            window.alert("Você não informou um operador VÁLIDO!");
        }
        document.getElementById("num1").innerText = numero1;
        document.getElementById("num2").innerText = numero2;
        document.getElementById("operacao").innerText = operacao;
        document.getElementById("resultado").innerText = resultado;


        //document.write('Número 1 '+ num1 +'!');
        //document.write(`Número 1 ${num1}!`);
    </script>
</body>
