<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <!-- Responsive Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon  Tag -->
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>DESAFIO 04 - IMC</title>
    <meta name="description" content="Conteúdo das aulas de JS">
    <meta name="keywords" content="sites, web, frontend">
    <meta name="author" content="Gregorio Queiroz, gregorio@gregmaster.com.br, gregmasterbr@gmail.com">
</head>


<body>
    <h1> Calculadora de IMC </h1>
    <hr>
    <p id="resposta"></p>
    <script>
        window.alert("DESAFIO 4");

        let peso = window.prompt("DIGITE O SEU PESO");
        let altura = window.prompt("DIGITE A SUA ALTURA");
        let imc = parseFloat(peso) / (parseFloat(altura) * parseFloat(altura));
        let resposta = "";
        if (imc < 18.5) {
            resposta = "Abaixo do peso";
        } else if (imc >= 18.5 && imc < 25) {
            resposta = "Peso normal";
        } else if (imc >= 25 && imc < 30) {
            resposta = "Acima do peso";
        } else if (imc >= 30 && imc < 35) {
            resposta = "Obesidade grau I";
        } else if (imc >= 35 && imc < 40) {
            resposta = "Obesidade grau II";
        } else {
            resposta = "Obesidade grau III";
        }
        document.getElementById("resposta").innerHTML = "O seu imc é: " + imc.toFixed(2) + " e a sua situação é: " + resposta;


    </script>
</body>

</html>
