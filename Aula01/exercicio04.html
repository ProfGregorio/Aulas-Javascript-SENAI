<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <!-- Responsive Meta Tag -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <!-- Favicon  Tag -->
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>EXERCÍCIO 04 - JAVASCRIPT</title>
    <meta name="description" content="Conteúdo das aulas de JS">
    <meta name="keywords" content="sites, web, frontend">
    <meta name="author" content="Gregorio Queiroz, gregorio@gregmaster.com.br, gregmasterbr@gmail.com">
</head>
<body>
    <h1>Integrando os recursos de interatividade do JS</h1>
    <hr>
    <script>
        window.alert("Seja bem-vindo ao site");
        let nome = window.prompt("QUAL É O SEU NOME? ");
        
        console.log(nome);
        let resposta = window.confirm("Você deseja sair da página? ");
        console.log(resposta);   
        if(resposta==true){
            console.log("VOCÊ ESTÁ PRESTES A SAIR DA PÁGINA!");
            setTimeout(() => {                
                window.close()
            }, 3000); // 3000 milissegundos = 3 segundos
            
        }else{
            window.alert("Aproveite o meu site, " +nome);
        }
     </script>
</body>
</html>
