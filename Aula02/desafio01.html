<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <!-- Responsive Meta Tag -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <!-- Favicon  Tag -->
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>DESAFIO 01 - JAVASCRIPT</title>
    <meta name="description" content="Conteúdo das aulas de JS">
    <meta name="keywords" content="sites, web, frontend">
    <meta name="author" content="Gregorio Queiroz, gregorio@gregmaster.com.br, gregmasterbr@gmail.com">
</head>
<body>
    <h1><mark>MANIPULANDO ELEMENTOS (TAGS)</mark> DO HTML ATRAVÉS DO JS</h1>
    <hr>
    <div>
        <p>ESTAMOS APRENDENDO JAVASCRIPT</p>
        <hr>
        <p>Aprender é Muito Legal</p>
        <p>E para ajudar o aprendizado, é PRECISO praticar e exercitar</p>
    </div>    
    <script>
        const tags_p = document.getElementsByTagName('p');
        console.log(tags_p);
        let tag_p_1 = tags_p[0];
        let tag_p_2 = tags_p[1];
        let tag_p_3 = tags_p[2];
        
        tag_p_1.style.backgroundColor="purple";
        tag_p_1.style.color="white";

        tag_p_2.style.textAlign="center"
        tag_p_2.style.fontSize="30pt"

        tag_p_3.style.background="yellow"
        tag_p_3.style.textAlign="center"
        
        tag_p_3.innerText = "A TURMA DO DEV É ESPETACULAR DEMAIS!"
        const tag_body = document.getElementsByTagName('body')[0];
        tag_body.style.backgroundColor="aquamarine";
        console.log(tag_body);
        
        const tag_div = document.getElementsByTagName('div')[0];
        console.log(tag_div);
        tag_div.style.backgroundColor = "antiquewhite"
        tag_div.style.border = "5px";
        tag_div.style.padding = "10px";
        tag_div.style.borderStyle="solid";
        tag_div.style.borderColor="red";

        const novo_p = document.createElement("p");
        novo_p.innerHTML = "Eu fui adicionado de forma DINÂMICA!";
        tag_div.appendChild(novo_p);        

        document.write('<h2>UAAAU, <mark>JAVASCRIPT É MUITO LEGAL!</mark></h2>')
    </script>

    
</body>
<html>
