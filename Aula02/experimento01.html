<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <!-- Responsive Meta Tag -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <!-- Favicon  Tag -->
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>DESAFIO 04 - JAVASCRIPT</title>
    <meta name="description" content="Conteúdo das aulas de JS">
    <meta name="keywords" content="sites, web, frontend">
    <meta name="author" content="Gregorio Queiroz, gregorio@gregmaster.com.br, gregmasterbr@gmail.com">
</head>
<body>
    <h1><mark>CRIANDO ELEMENTOS HTML (TR) </mark> DINAMICAMENTO ATRAVÉS DO JS</h1>
    <hr>
    <div>
        <table border="1">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>URL</th>
                </tr>
            </thead>
            <tbody id="pokemonTableBody"></tbody>
        </table>
    </div>
 
    <script>
        
     fetch("https://pokeapi.co/api/v2/pokemon?limit=20&offset=0")
    .then(response => response.json())
    .then(data => {

        // tbody onde as linhas serão adicionadas
        const tbody = document.getElementById("pokemonTableBody");

        // percorre o array results do JSON
        data.results.forEach(pokemon => {

            // cria a linha
            const tr = document.createElement("tr");

            // cria a célula do nome
            const tdNome = document.createElement("td");
            tdNome.textContent = pokemon.name;

            // cria a célula da URL
            const tdUrl = document.createElement("td");
            tdUrl.textContent = pokemon.url;

            // adiciona as células na linha
            tr.appendChild(tdNome);
            tr.appendChild(tdUrl);

            // adiciona a linha na tabela
            tbody.appendChild(tr);
        });
    });         
     
        

    </script>

    
</body>
<html>
