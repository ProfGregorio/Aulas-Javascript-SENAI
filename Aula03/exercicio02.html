<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <!-- Responsive Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon  Tag -->
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>EXERCÍCIO 02 - JAVASCRIPT</title>
    <meta name="description" content="Conteúdo das aulas de JS">
    <meta name="keywords" content="sites, web, frontend">
    <meta name="author" content="Gregorio Queiroz, gregorio@gregmaster.com.br, gregmasterbr@gmail.com">
</head>
<body>
    <h1><mark>INTERAÇÃO JS COM FORMS</mark> DO HTML</h1>
    <hr>
    <form action="#">
        <input type="number" name="num1" id="num1" placeholder="Digite o 1° número" required>
        <input type="number" name="num2" id="num2" placeholder="Digite o 2° número" required>
        <br>
        <hr>
        <input type="button" value="Adição" onclick="somar();">
        <input type="button" value="Subtração" onclick="subtracao();">
        <input type="button" value="Limpar" onclick="limpar_campos()">
    </form>
    <div>
        <p><span id="resultado"></span></p>
    </div>
    <script>
        function somar(){
            let valor1 = document.getElementById('num1')
            let valor2 = document.getElementById('num2')
            let soma = Number(valor1.value) + Number(valor2.value)
            document.getElementById('resultado').innerText = "O resultado é "+soma
            //document.getElementById('resultado').innerText = `O resultado é ${soma}`
        }
        function subtracao(){
            let valor1 = document.getElementById('num1')
            let valor2 = document.getElementById('num2')
            let subtr = Number(valor1.value) - Number(valor2.value)
            document.getElementById('resultado').innerText = "O resultado é "+subtr
            //document.getElementById('resultado').innerText = `O resultado é ${subtr}`
        }
            
        function limpar_campos(){
            document.getElementById('num1').value=""
            document.getElementById('num2').value=""
            document.getElementById('resultado').innerText =""
        }
    </script>
</body>
</html>
