<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <!-- Responsive Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon  Tag -->
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>EXERCÍCIO 02 - JAVASCRIPT</title>
    <meta name="description" content="Conteúdo das aulas de JS">
    <meta name="keywords" content="sites, web, frontend">
    <meta name="author" content="Gregorio Queiroz, gregorio@gregmaster.com.br, gregmasterbr@gmail.com">
</head>
<body>
    <h1><mark>INTERAÇÃO JS COM FORMS</mark> DO HTML</h1>
    <hr>
    <form action="#">
        <input type="number" name="num1" id="num1" placeholder="Digite o 1° número" required>
        <span></span>
        <input type="number" name="num2" id="num2" placeholder="Digite o 2° número" required>
        <input type="button" value="somar" onclick="somar();">
    </form>
    <div>
        <p><span id="resultado"></span></p>
    </div>
    <script type="text/javascript">
        function somar(){
        var valor1 = document.getElementById('num1')
        var valor2 = document.getElementById('num2')
        var soma = Number(valor1.value) + Number(valor2.value)
        document.getElementById('resultado').innerText = `O resultado é ${soma}`

        }
    </script>
</body>
</html>
